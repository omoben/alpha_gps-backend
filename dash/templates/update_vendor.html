{% extends "base.html" %}
{% block title %}Update Vendor{% endblock %}
{% block content %}
<h2>Update Vendor</h2>
<form method="POST">
    <div class="form-group">
        <label for="company_name">Company Name</label>
        <input type="text" name="company_name" id="company_name" value="{{ vendor.company_name }}" class="form-control">
    </div>
    <div class="form-group">
        <label for="contact_info">Contact Information</label>
        <input type="text" name="contact_info" id="contact_info" value="{{ vendor.contact_info }}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Update</button>
</form>
{% endblock %}
