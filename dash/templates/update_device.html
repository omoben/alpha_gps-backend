{% extends "base.html" %}
{% block title %}Update Device{% endblock %}
{% block content %}
<h2>Update Device</h2>
<form method="POST">
    <div class="form-group">
        <label for="device_name">Device Name</label>
        <input type="text" name="device_name" id="device_name" value="{{ device.device_name }}" class="form-control">
    </div>
    <div class="form-group">
        <label for="user_id">User ID</label>
        <input type="text" name="user_id" id="user_id" value="{{ device.user_id }}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Update</button>
</form>
{% endblock %}
